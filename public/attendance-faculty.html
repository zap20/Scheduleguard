<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Attendance — ScheduleGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Libre+Baskerville:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme-boot.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>ScheduleGuard</h1>
          <div class="meta">Faculty attendance · <span id="user-label">…</span></div>
        </div>
        <div class="topbar-actions">
          <button id="logout-btn" class="btn btn-secondary" type="button">Sign out</button>
        </div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>My attendance</h2>
            <p class="panel-sub">
              Read-only view of your attendance scans matched to each scheduled class
              (subject, room, expected time vs. actual scan).
            </p>
          </div>
          <div class="count-chip"><span id="result-count">0</span> records</div>
        </div>

        <div id="attendance-alert" class="alert alert-error" role="alert"></div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Subject</th>
                <th>Room</th>
                <th>Expected</th>
                <th>Actual scan</th>
                <th>Status</th>
                <th>Counted</th>
                <th>Checker</th>
              </tr>
            </thead>
            <tbody id="attendance-body"></tbody>
          </table>
          <p id="attendance-empty" class="empty-state" hidden>No attendance records found for your schedules.</p>
        </div>
      </section>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/attendance-common.js"></script>
    <script src="js/attendance-faculty.js"></script>
  </body>
</html>
