<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocking Status — ScheduleGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Libre+Baskerville:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme-boot.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>ScheduleGuard</h1>
          <div class="meta">My blocking status · <span id="user-label">…</span></div>
        </div>
        <div class="topbar-actions">
          <button id="logout-btn" class="btn btn-secondary" type="button">Sign out</button>
        </div>
      </header>

      <section class="panel" style="margin-bottom: 1rem">
        <div class="panel-head">
          <div>
            <h2>Current status</h2>
            <p class="panel-sub">
              Read-only view of your clearance. An <strong>Active</strong> block prevents enrollment
              until it is cleared.
            </p>
          </div>
          <div id="status-chip" class="count-chip">…</div>
        </div>
        <div id="active-reason" class="conflict-panel" hidden></div>
        <div id="blocks-alert" class="alert alert-error" role="alert"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Block history</h2>
            <p class="panel-sub">All block records issued against your account.</p>
          </div>
          <div class="count-chip"><span id="result-count">0</span> records</div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Status</th>
                <th>Reason</th>
                <th>Department</th>
                <th>Issued by</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="blocks-body"></tbody>
          </table>
          <p id="blocks-empty" class="empty-state" hidden>No block records on your account.</p>
        </div>
      </section>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shell.js?v=nav-no-load-5"></script>
    <script src="js/attendance-common.js"></script>
    <script src="js/student-blocks.js"></script>
  </body>
</html>
